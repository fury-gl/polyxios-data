name: Update Models Catalog

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Run Catalog Updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            python .github/scripts/update_models_json.py --tag "${{ github.event.release.tag_name }}" --action "${{ github.event.action }}"
          else
            python .github/scripts/update_models_json.py
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add models.json README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[ci] chore: auto-update models.json and README.md"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
